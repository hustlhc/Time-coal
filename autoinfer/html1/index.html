<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>华电福建公司电煤采需决策系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4eaf1 100%);
            color: #333;
            line-height: 1.6;
        }
        
        .app-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        .ui-floor {
            background: white;
            box-shadow: 0 10px 30px rgba(26, 86, 219, 0.1);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #e8f0fe;
        }
        
        .floor-content {
            padding: 30px;
        }
        
        .foor-content-title {
            margin-bottom: 30px;
        }
        
        .title {
            font-size: 32px;
            font-weight: 700;
            color: #1a56db;
            margin-bottom: 20px;
            text-align: center;
            background: linear-gradient(135deg, #1a56db, #3498db);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            padding: 15px 0;
            border-bottom: 3px solid #1a56db;
        }
        
        .foor-content-table {
            margin-top: 20px;
        }
        
        .controls {
            display: flex;
        }
        
        /* 左侧按钮选择 */
        .button-group-vertical {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .main-button {
            padding: 16px 24px;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border: 2px solid #e0e7ff;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.3s ease;
            text-align: left;
            position: relative;
            overflow: hidden;
        }
        
        .main-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(26, 86, 219, 0.2), transparent);
            transition: left 0.5s ease;
        }
        
        .main-button:hover {
            background: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 100%);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(26, 86, 219, 0.2);
            border-color: #1a56db;
        }
        
        .main-button:hover::before {
            left: 100%;
        }
        
        .main-button.active {
            background: linear-gradient(135deg, #1a56db 0%, #2563eb 100%);
            color: white;
            border-color: #1a56db;
            box-shadow: 0 6px 20px rgba(26, 86, 219, 0.4);
        }
        
        .main-button.active::before {
            display: none;
        }
        
        /* 右侧页面内容区域 */
        .page-content {
            min-height: 600px;
        }
        
        h2 {
            font-size: 24px;
            font-weight: 700;
            color: #1a56db;
            margin-bottom: 24px;
            text-align: center;
            background: linear-gradient(135deg, #1a56db, #3498db);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            padding: 12px 0;
            border-bottom: 2px solid #e0e7ff;
        }
        
        h3 {
            font-size: 18px;
            font-weight: 700;
            color: #1a56db;
            margin-bottom: 18px;
            padding-bottom: 8px;
            border-bottom: 2px solid #e0e7ff;
        }
        
        .page-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding: 20px;
            background: linear-gradient(135deg, #f8f9fa 0%, #eef2ff 100%);
            border-radius: 10px;
            border: 1px solid #e0e7ff;
            box-shadow: 0 2px 8px rgba(26, 86, 219, 0.1);
        }
        
        /* 数据概览卡片 */
        .overview-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 18px;
            margin-bottom: 24px;
        }
        
        .overview-card {
            padding: 24px;
            background: linear-gradient(135deg, #ffffff 0%, #f8faff 100%);
            border-radius: 10px;
            box-shadow: 0 4px 16px rgba(26, 86, 219, 0.15);
            border-left: 4px solid #1a56db;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .overview-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #1a56db, #3498db, #1a56db);
            animation: gradientFlow 3s ease infinite;
        }
        
        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .overview-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(26, 86, 219, 0.25);
        }
        
        .overview-card h4 {
            font-size: 15px;
            font-weight: 600;
            color: #4b5563;
            margin-bottom: 12px;
        }
        
        .overview-card .value {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #1a56db, #3498db);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .overview-card .unit {
            font-size: 14px;
            color: #6b7280;
            margin-left: 8px;
        }
        
        /* 数据表格 */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 24px;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(26, 86, 219, 0.15);
        }
        
        .data-table th,
        .data-table td {
            padding: 14px 18px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }
        
        .data-table th {
            background: linear-gradient(135deg, #f8f9fa 0%, #eef2ff 100%);
            font-weight: 700;
            color: #1a56db;
            position: sticky;
            top: 0;
        }
        
        .data-table tr:hover {
            background: linear-gradient(135deg, #f8f9fa 0%, #eef2ff 100%);
        }
        
        /* 趋势分析 */
        .trend-analysis {
            margin-top: 24px;
            padding: 24px;
            background: linear-gradient(135deg, #f8f9fa 0%, #eef2ff 100%);
            border-radius: 10px;
            box-shadow: 0 4px 12px rgba(26, 86, 219, 0.1);
            border: 1px solid #e0e7ff;
        }
        
        .trend-analysis p {
            margin-bottom: 12px;
            line-height: 1.6;
            color: #4b5563;
        }
        
        /* 数据来源 */
        .data-source {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e0e7ff;
            font-size: 12px;
            color: #6b7280;
            text-align: center;
        }
        
        /* 操作按钮 */
        .action-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            justify-content: center;
        }
        
        .action-button {
            padding: 10px 20px;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border: 2px solid #e0e7ff;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .action-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(26, 86, 219, 0.2), transparent);
            transition: left 0.5s ease;
        }
        
        .action-button:hover {
            background: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 100%);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(26, 86, 219, 0.2);
            border-color: #1a56db;
        }
        
        .action-button:hover::before {
            left: 100%;
        }
        
        .action-button.primary {
            background: linear-gradient(135deg, #1a56db 0%, #2563eb 100%);
            color: white;
            border-color: #1a56db;
        }
        
        .action-button.primary:hover {
            background: linear-gradient(135deg, #1548b3 0%, #1d4ed8 100%);
            box-shadow: 0 6px 16px rgba(26, 86, 219, 0.4);
        }
        
        .date-control {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .date-control label {
            font-weight: 600;
            color: #4b5563;
        }
        
        .time-range-control {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .time-range-control label {
            font-weight: 600;
            color: #4b5563;
        }
        
        .date-picker {
            padding: 10px 16px;
            border: 2px solid #e0e7ff;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
            background: white;
        }
        
        .date-picker:focus {
            outline: none;
            border-color: #1a56db;
            box-shadow: 0 0 0 3px rgba(26, 86, 219, 0.2);
            transform: translateY(-1px);
        }
        
        .range-button {
            padding: 8px 18px;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border: 2px solid #e0e7ff;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .range-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(26, 86, 219, 0.2), transparent);
            transition: left 0.5s ease;
        }
        
        .range-button:hover {
            background: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 100%);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(26, 86, 219, 0.2);
            border-color: #1a56db;
        }
        
        .range-button:hover::before {
            left: 100%;
        }
        
        .range-button.active {
            background: linear-gradient(135deg, #1a56db 0%, #2563eb 100%);
            color: white;
            border-color: #1a56db;
            box-shadow: 0 4px 12px rgba(26, 86, 219, 0.4);
        }
        
        /* 煤种选择器 */
        .coal-type-selector {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        
        .coal-button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border: 2px solid #e0e7ff;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            font-weight: 600;
            position: relative;
            overflow: hidden;
        }
        
        .coal-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(26, 86, 219, 0.2), transparent);
            transition: left 0.5s ease;
        }
        
        .coal-button:hover {
            background: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 100%);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(26, 86, 219, 0.2);
            border-color: #1a56db;
        }
        
        .coal-button:hover::before {
            left: 100%;
        }
        
        .coal-button.active {
            background: linear-gradient(135deg, #1a56db 0%, #2563eb 100%);
            color: white;
            border-color: #1a56db;
            box-shadow: 0 4px 12px rgba(26, 86, 219, 0.4);
        }
        
        /* 图表容器 */
        .mw-all {
            width: 100%;
        }
        
        .mh-580 {
            height: 580px;
        }
        
        .mt-10 {
            margin-top: 10px;
        }
        
        /* 图表容器美化 */
        .chart-container {
            background: linear-gradient(135deg, #ffffff 0%, #f8faff 100%);
            border-radius: 10px;
            box-shadow: 0 4px 16px rgba(26, 86, 219, 0.15);
            border: 1px solid #e0e7ff;
            padding: 20px;
            margin-bottom: 24px;
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
            }
            
            .button-group-vertical {
                margin-right: 0;
                margin-bottom: 20px;
            }
            
            .page-controls {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
            
            .time-range-control {
                flex-wrap: wrap;
            }
        }
    </style>
    <!-- ECharts -->
    <script src="echarts.min.js"></script>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="bootstrap.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="font-awesome.min.css">
    <!-- Bootstrap Datepicker CSS -->
    <link rel="stylesheet" href="bootstrap-datepicker.min.css">
    <!-- jQuery -->
    <script src="jquery.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="bootstrap.bundle.min.js"></script>
    <!-- Bootstrap Datepicker JS -->
    <script src="bootstrap-datepicker.min.js"></script>
    <script src="bootstrap-datepicker.zh-CN.min.js"></script>
</head>
<body>
    <div class="app-content">
        <div class="ui-floor ui-f_h mt-40" id="floor1">
            <div class="ui-floor-nav clear">
                <div class="floor-content">
                    <div class="foor-content-title">
                        <div class="float-left">
                            <h1 id="title" class="title">华电福建公司电煤采需决策系统</h1>
                        </div>
                    </div>
                    
                    <div class="foor-content-table">
                        <div class="controls" style="display: flex;">
                            <!-- 左侧按钮选择 -->
                            <div style="flex: 0 0 250px; margin-right: 20px;">
                                <div class="button-group-vertical">
                                    <button class="main-button" onclick="window.location.href='main.html'" style="background: linear-gradient(135deg, #1a56db 0%, #3498db 100%); color: white;">
                                         返回主界面
                                    </button>
                                    <button class="main-button" data-page="domestic-coal">北方港煤价</button>
                                    <button class="main-button" data-page="international-coal">进口煤价</button>
                                    <button class="main-button" data-page="domestic-freight">国内海运费</button>
                                    <button class="main-button" data-page="international-freight">国际海运费</button>
                                    <button class="main-button" data-page="power-generation">发电量预测</button>
                                    <button class="main-button" data-page="decision-model">采需决策</button>
                                    <div class="dropdown" style="position: relative; display: inline-block;">
                                        <button class="main-button dropdown-toggle" onclick="toggleWeeklyReportDropdown()" style="background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%); color: white;">
                                            下载周报
                                            
                                        </button>
                                        <div id="weeklyReportDropdown" class="dropdown-content" style="display: none; position: fixed; right: 20px; top: 100px; background-color: #f9f9f9; min-width: 200px; max-height: 400px; box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2); z-index: 1000; border-radius: 5px; overflow: hidden;">
                                            <a href="#" onclick="downloadLatestWeeklyReport()" style="color: black; padding: 12px 16px; text-decoration: none; display: block;">最新周报</a>
                                            <div id="historicalReports" style="max-height: 300px; overflow-y: auto;">
                                                <!-- 历史周报列表将在这里动态生成 -->
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- 右侧页面内容区域 -->
                            <div style="flex: 1;">
                                <!-- 国内煤价页面 -->
                                <div class="page-content" id="domestic-coal-page">
                                    <h2>国内北方港电煤价格预测</h2>
                                    <div class="page-controls">
                                        <div class="date-control">
                                            <label for="datePicker-domestic-coal" title="以该日期为基准，显示未来指定周期的预测值和曲线">选择日期：</label>
                                            <input type="text" class="date-picker" id="datePicker-domestic-coal" placeholder="年-月-日" title="以该日期为基准，显示未来指定周期的预测值和曲线">
                                        </div>
                                        <div class="time-range-control">
                                            <label title="基于基准日输出未来指定周期(指数日)的预测值和曲线">时间范围：</label>
                                            <button class="range-button" data-days="5" data-page="domestic-coal" title="基于基准日输出未来5天的预测值和曲线">5日</button>
                                            <button class="range-button" data-days="10" data-page="domestic-coal" title="基于基准日输出未来10天的预测值和曲线">10日</button>
                                            <button class="range-button" data-days="20" data-page="domestic-coal" title="基于基准日输出未来20天的预测值和曲线">20日</button>
                                            <button class="range-button" data-days="60" data-page="domestic-coal" title="基于基准日输出未来60天的预测值和曲线">60日</button>
                                        </div>
                                    </div>
                                    <div class="coal-type-selector">
                                        <button class="coal-button" data-type="CCI4500infer" data-page="domestic-coal">CCI4500</button>
                                        <button class="coal-button" data-type="CCI5000infer" data-page="domestic-coal">CCI5000</button>
                                        <button class="coal-button" data-type="CCI5500infer" data-page="domestic-coal">CCI5500</button>
                                    </div>
                                    <div class="action-buttons">
                                        <button class="action-button primary" onclick="downloadData('domestic-coal')">
                                            <i class="fa fa-download"></i> 下载数据报表
                                        </button>
                                    </div>
                                    <div class="chart-container">
                                        <div id="chart-domestic-coal" class="mw-all mh-580 mt-10"></div>
                                    </div>
                                </div>

                                <!-- 国际煤价页面 -->
                                <div class="page-content" id="international-coal-page" style="display: none;">
                                    <h2>进口煤价格预测</h2>
                                    <div class="page-controls">
                                        <div class="date-control">
                                            <label for="datePicker-international-coal" title="以该日期为基准，显示未来指定周期的预测值和曲线">选择日期：</label>
                                            <input type="text" class="date-picker" id="datePicker-international-coal" placeholder="年-月-日" title="以该日期为基准，显示未来指定周期的预测值和曲线">
                                        </div>
                                        <div class="time-range-control">
                                            <label title="基于基准日输出未来指定周期(指数日)的预测值和曲线">时间范围：</label>
                                            <button class="range-button" data-days="5" data-page="international-coal" title="基于基准日输出未来5天的预测值和曲线">5日</button>
                                            <button class="range-button" data-days="10" data-page="international-coal" title="基于基准日输出未来10天的预测值和曲线">10日</button>

                                    </div>
                                    <div class="action-buttons">
                                        <button class="action-button primary" onclick="downloadData('international-coal')">

                                    <div class="chart-container">

                                    </div>
                                </div>

                                <!-- 国内运费页面 -->

                                    <h2>国内煤炭海运费预测</h2>

                                    <div class="page-controls">

                                        </div>
                                    </div>
                                    <div class="action-buttons">
                                        <button class="action-button primary" onclick="downloadData('domestic-freight')">
                                            <i class="fa fa-download"></i> 下载数据报表
                                        </button>

    <script>
        // ==================== 全局变量定义 ====================
        var nowDate;
        var currentType = 'CCI4500infer';
        var currentDays = 5;
        var lastSelectedPlant = 'kemen';
        var currentSelectedDate = null;
        
        var user = 'test_user';
        var isPredictionVIP = true;
        
        // 决策数据存储对象 - 按电厂存储
        var decisionData = {
            kemen: null,
            shaowu: null,
            yongan: null,
            zhangping: null
        };
        
        // 当前选中的电厂
        var currentPlant = 'kemen';
        
        // JSON文件配置
        var jsonConfig = {
            basePath: './procure_plan/',  // JSON文件存放路径
            files: {
                kemen: 'kemen_procurement_plan.json',
                shaowu: 'shaowu_procurement_plan.json',
                yongan: 'yongan_procurement_plan.json',
                zhangping: 'zhangping_procurement_plan.json'
            }
        };
        
        // 电厂中文名称映射
        var plantNameMap = {
            'kemen': '可门电厂',
            'shaowu': '邵武电厂',
            'yongan': '永安电厂',
            'zhangping': '漳平电厂'
        };
        
        // ==================== DOM加载完成事件 ====================
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOMContentLoaded开始执行');
            // 使用当前日期作为日期选择器的最新可选日期
            nowDate = new Date().format('Y-m-d');
            
            // 初始化日期选择器
            $('.date-picker').datepicker({
                language: 'zh-CN',
                autoclose: true,
                clearBtn: true,
                format: 'yyyy-mm-dd',
                todayHighlight: true,
                endDate: nowDate
            }).on('changeDate', function(e) {
                currentSelectedDate = e.format();
                checkTime();
            });
            
            // 为所有日期选择器设置默认值
            document.querySelectorAll('.date-picker').forEach(function(picker) {
                picker.value = nowDate;
            });
            currentSelectedDate = nowDate;
            
            // 触发日期选择事件，加载图表
            checkTime();
            
            // 获取所有主按钮、煤种按钮和时间范围按钮
            const mainButtons = document.querySelectorAll('.main-button');
            const coalButtons = document.querySelectorAll('.coal-button[data-type]');
            const rangeButtons = document.querySelectorAll('.range-button');
            
            // 为主要按钮添加点击事件
            mainButtons.forEach(function(button) {
                button.addEventListener('click', function() {
                    const pageId = this.getAttribute('data-page');
                    showPage(pageId);
                    
                    mainButtons.forEach(function(btn) { btn.classList.remove('active'); });
                    this.classList.add('active');
                });
            });
            
            // 检查URL锚点并显示对应的页面
            function checkHash() {
                const hash = window.location.hash;
                if (hash) {
                    const pageId = hash.replace('#', '').replace('-page', '');
                    if (pageId) {
                        showPage(pageId);
                        
                        mainButtons.forEach(function(btn) {
                            if (btn.getAttribute('data-page') === pageId) {
                                btn.classList.add('active');
                            } else {
                                btn.classList.remove('active');
                            }
                        });
                        return;
                    }
                }
                
                // 默认显示第一个页面
                showPage('domestic-coal');
                mainButtons.forEach(function(btn, index) {
                    if (index === 1) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                });
            }
            
            // 页面加载时检查锚点
            checkHash();
            
            // 为煤种按钮添加点击事件
            coalButtons.forEach(function(button) {
                button.addEventListener('click', function() {
                    const pageId = this.getAttribute('data-page');
                    const type = this.getAttribute('data-type');
                    
                    const samePageButtons = document.querySelectorAll('.coal-button[data-page="' + pageId + '"][data-type]');
                    samePageButtons.forEach(function(btn) { btn.classList.remove('active'); });
                    this.classList.add('active');
                    currentType = type;
                    lastSelectedPlant = type;
                    
                    // 如果是发电量页面，检查是否需要更新机组选择器
                    if (pageId === 'power-generation') {
                        const activeUnitButton = document.querySelector('.coal-button[data-page="power-generation"][data-unit].active');
                        const currentUnit = activeUnitButton ? activeUnitButton.getAttribute('data-unit') : 'total';
                        
                        // 如果当前是分机组模式，重新加载机组列表
                        if (currentUnit === 'units') {
                            const unitSelector = document.getElementById('unit-selector');
                            if (unitSelector) {
                                unitSelector.style.display = 'block';
                                loadUnitList(type);
                            }
                        }
                    }
                    
                    if (pageId === 'decision-model') {
                        currentPlant = type;
                        if (!decisionData[type]) {
                            loadPlantDecisionData(type);
                        } else {
                            updateDecisionPageUI(type);
                            loadChart(pageId, type, currentDays);
                        }
                    } else {
                        loadChart(pageId, type, currentDays);
                    }
                });
            });
            
            // 为时间范围按钮添加点击事件
            rangeButtons.forEach(function(button) {
                button.addEventListener('click', function() {
                    const pageId = this.getAttribute('data-page');
                    const days = parseInt(this.getAttribute('data-days'));
                    
                    const samePageButtons = document.querySelectorAll('.range-button[data-page="' + pageId + '"]');
                    samePageButtons.forEach(function(btn) { btn.classList.remove('active'); });
                    this.classList.add('active');
                    currentDays = days;
                    
                    loadChart(pageId, null, days);
                });
            });
            
            // 为分机组按钮添加点击事件
            document.querySelectorAll('.coal-button[data-unit]').forEach(function(button) {
                button.addEventListener('click', function(e) {
                    const pageId = this.getAttribute('data-page');
                    const unit = this.getAttribute('data-unit');
                    
                    e.stopPropagation();
                    
                    const samePageButtons = document.querySelectorAll('.coal-button[data-page="' + pageId + '"][data-unit]');
                    samePageButtons.forEach(function(btn) { btn.classList.remove('active'); });
                    this.classList.add('active');
                    
                    const selector = '.coal-button[data-page="' + pageId + '"][data-type].active';
                    let activePlantButton = document.querySelector(selector);
                    
                    let currentPlantType;
                    if (activePlantButton) {
                        currentPlantType = activePlantButton.getAttribute('data-type');
                    } else {
                        currentPlantType = lastSelectedPlant;
                        const allPlantButtons = document.querySelectorAll('.coal-button[data-page="' + pageId + '"][data-type]');
                        allPlantButtons.forEach(function(btn) { btn.classList.remove('active'); });
                        const plantButton = document.querySelector('.coal-button[data-page="' + pageId + '"][data-type="' + lastSelectedPlant + '"]');
                        if (plantButton) {
                            plantButton.classList.add('active');
                        }
                    }
                    
                    // 显示/隐藏机组选择器
                    const unitSelector = document.getElementById('unit-selector');
                    if (unit === 'units' && unitSelector) {
                        unitSelector.style.display = 'block';
                        // 加载机组列表
                        loadUnitList(currentPlantType);
                    } else if (unitSelector) {
                        unitSelector.style.display = 'none';
                    }
                    
                    loadChart(pageId, currentPlantType, currentDays, true);
                });
            });
            
            // 监听哈希变化事件
            window.addEventListener('hashchange', checkHash);
            
            // 切换周报下拉菜单
            window.toggleWeeklyReportDropdown = function() {
                const dropdown = document.getElementById('weeklyReportDropdown');
                if (dropdown.style.display === 'block') {
                    dropdown.style.display = 'none';
                } else {
                    dropdown.style.display = 'block';
                    // 加载历史周报列表
                    loadHistoricalReports();
                }
            };
            
            // 点击其他地方关闭下拉菜单
            window.onclick = function(event) {
                if (!event.target.matches('.dropdown-toggle')) {
                    const dropdowns = document.getElementsByClassName('dropdown-content');
                    for (let i = 0; i < dropdowns.length; i++) {
                        const openDropdown = dropdowns[i];
                        if (openDropdown.style.display === 'block') {
                            openDropdown.style.display = 'none';
                        }
                    }
                }
            };
            
            // 加载历史周报列表
            function loadHistoricalReports() {
                const reportDirectory = '/week_report/';
                const historicalReportsContainer = document.getElementById('historicalReports');
                
                // 清空容器
                historicalReportsContainer.innerHTML = '<p style="padding: 12px 16px; color: #666; margin: 0;">加载中...</p>';
                
                console.log('开始加载历史周报，目录:', reportDirectory);
                
                // 尝试获取周报文件列表
                fetch(reportDirectory)
                    .then(response => {
                        console.log('响应状态:', response.status);
                        if (!response.ok) {
                            throw new Error('无法访问周报目录+'+reportDirectory+', 状态码:'+response.status);
                        }
                        return response.text();
                    })
                    .then(html => {
                        console.log('获取到HTML内容长度:', html.length);
                        console.log('HTML内容前1000字符:', html.substring(0, 1000));
                        
                        // 解析HTML内容，查找所有Excel文件链接
                        const parser = new DOMParser();
                        const doc = parser.parseFromString(html, 'text/html');
                        const links = doc.querySelectorAll('a[href$=".xlsx"]');
                        
                        console.log('找到的Excel文件链接数量:', links.length);
                        
                        if (links.length === 0) {
                            historicalReportsContainer.innerHTML = '<p style="padding: 12px 16px; color: #666; margin: 0;">没有找到历史周报</p>';
                            return;
                        }
                        
                        // 提取文件名并按日期排序
                        const files = Array.from(links).map(link => {
                            let href = link.getAttribute('href');
                            // 确保路径包含 /week_report/ 前缀
                            if (!href.startsWith('/week_report/')) {
                                href = '/week_report/' + href;
                            }
                            let filename = href.split('/').pop();
                            console.log('找到文件:', filename, '路径:', href);
                            
                            // 尝试解码文件名，处理乱码问题
                            try {
                                // 尝试解码URL编码的文件名
                                filename = decodeURIComponent(filename);
                                console.log('解码后的文件名:', filename);
                            } catch (e) {
                                console.log('解码失败:', e);
                            }
                            
                            // 提取日期范围作为显示文本
                            let displayName = filename;
                            const dateMatch = filename.match(/\((\d+\.\d+-\d+\.\d+)\)/);
                            if (dateMatch && dateMatch[1]) {
                                displayName = dateMatch[1];
                            } else {
                                // 如果无法提取日期范围，尝试直接显示文件名（去除扩展名）
                                displayName = filename.replace('.xlsx', '');
                            }
                            
                            return {
                                name: filename,
                                displayName: displayName,
                                path: href
                            };
                        });
                        
                        // 按文件名排序（假设文件名包含日期信息）
                        files.sort((a, b) => {
                            return b.name.localeCompare(a.name);
                        });
                        
                        console.log('排序后的文件列表:', files);
                        
                        // 清空容器
                        historicalReportsContainer.innerHTML = '';
                        
                        // 生成历史周报列表
                        console.log('开始生成历史周报列表...');
                        files.forEach(file => {
                            console.log('添加文件:', file.name, '显示名称:', file.displayName);
                            const link = document.createElement('a');
                            link.href = '#';
                            link.onclick = function() {
                                downloadReport(file.path, file.name);
                                return false;
                            };
                            link.style = 'color: black; padding: 12px 16px; text-decoration: none; display: block;';
                            link.textContent = file.displayName;
                            historicalReportsContainer.appendChild(link);
                            console.log('文件添加成功:', file.name, '显示名称:', file.displayName);
                        });
                        console.log('历史周报列表生成完成，共添加', files.length, '个文件');
                        console.log('historicalReportsContainer内容:', historicalReportsContainer.innerHTML);
                    })
                    .catch(error => {
                        console.error('加载历史周报失败:', error);
                        historicalReportsContainer.innerHTML = '<p style="padding: 12px 16px; color: #666; margin: 0;">加载失败: '+error.message+'</p>';
                    });
            }
            
            // 下载指定的周报文件
            function downloadReport(path, filename) {
                // 直接使用完整路径
                const downloadUrl = path;
                console.log('下载文件:', filename, '路径:', downloadUrl);
                const link = document.createElement('a');
                link.href = downloadUrl;
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                // 关闭下拉菜单
                document.getElementById('weeklyReportDropdown').style.display = 'none';
            }
            
            // 下载最新周报函数
            window.downloadLatestWeeklyReport = function() {
                const reportDirectory = '/week_report/';
                
                // 尝试获取最新的周报文件
                fetch(reportDirectory)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('无法访问周报目录+'+reportDirectory);
                        }
                        return response.text();
                    })
                    .then(html => {
                        // 解析HTML内容，查找所有Excel文件链接
                        const parser = new DOMParser();
                        const doc = parser.parseFromString(html, 'text/html');
                        const links = doc.querySelectorAll('a[href$=".xlsx"]');
                        
                        if (links.length === 0) {
                            alert('周报目录中没有找到Excel文件');
                            return;
                        }
                        
                        // 提取文件名并按日期排序
                        const files = Array.from(links).map(link => {
                            let href = link.getAttribute('href');
                            // 确保路径包含 /week_report/ 前缀
                            if (!href.startsWith('/week_report/')) {
                                href = '/week_report/' + href;
                            }
                            const filename = href.split('/').pop();
                            return {
                                name: filename,
                                path: href
                            };
                        });
                        
                        // 按文件名排序（假设文件名包含日期信息）
                        files.sort((a, b) => {
                            return b.name.localeCompare(a.name);
                        });
                        
                        // 获取最新的文件
                        const latestFile = files[0];
                        
                        // 下载最新文件
                        downloadReport(latestFile.path, latestFile.name);
                    })
                    .catch(error => {
                        console.error('下载周报失败:', error);
                        alert('下载周报失败，请检查周报目录是否存在');
                    });
            };
            
            // ========== 预加载所有电厂数据 ==========
            console.log('开始预加载所有电厂数据...');
            
            // 所有电厂列表
            const allPlants = ['kemen', 'shaowu', 'yongan', 'zhangping'];
            
            // 同时加载所有电厂数据
            allPlants.forEach(plant => {
                loadPlantDecisionData(plant);
            });
            
            console.log('DOMContentLoaded执行完成');
        });

        // 从JSON文件加载决策数据（备用方案）
        function loadPlantDecisionDataFromJSON(plantType) {
            const filePath = jsonConfig.basePath + jsonConfig.files[plantType];
            const timestamp = new Date().getTime();
            const urlWithTimestamp = filePath + '?t=' + timestamp;
            
            fetch(urlWithTimestamp, {
                method: 'GET',
                headers: {
                    'Accept': 'application/json',
                    'Cache-Control': 'no-cache, no-store, must-revalidate',
                    'Pragma': 'no-cache'
                }
            })
            .then(response => {
                if (!response.ok) {
                    if (response.status === 404) {
                        throw new Error(`文件不存在: ${jsonConfig.files[plantType]}`);
                    }
                    throw new Error(`HTTP ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                if (!data) {
                    throw new Error(plantNameMap[plantType] + '数据为空');
                }
                
                // 验证数据格式
                if (!data.procurement_plan || !Array.isArray(data.procurement_plan)) {
                    throw new Error('数据格式错误');
                }
                
                decisionData[plantType] = data;
                
                // 更新决策历史下拉框（模拟）
                const dropdown = document.getElementById('decision-history-dropdown');
                if (dropdown) {
                    dropdown.innerHTML = '<option value="json">' + data.decision_date + ' - ' + 
                        plantNameMap[plantType] + ' (JSON数据)</option>';
                }
                
                // 如果当前选中是这个电厂且页面是采需决策页面，更新UI
                if (currentPlant === plantType) {
                    const activePage = document.querySelector('.page-content[style*="display: block"]');
                    if (activePage && activePage.id === 'decision-model-page') {
                        updateDecisionPageUI(plantType);
                        loadChart('decision-model', plantType, currentDays);
                    }
                }
            })
            .catch(error => {
                // 加载失败时使用默认数据
                if (defaultDecisionData[plantType]) {
                    decisionData[plantType] = defaultDecisionData[plantType];
                    
                    if (currentPlant === plantType) {
                        const activePage = document.querySelector('.page-content[style*="display: block"]');
                        if (activePage && activePage.id === 'decision-model-page') {
                            updateDecisionPageUI(plantType);
                            loadChart('decision-model', plantType, currentDays);
                        }
                    }
                }
            });
        }

        // ==================== 格式化数字（千位分隔符） ====================
        function formatNumber(value) {
            if (value === undefined || value === null) {
                return '0.00';
            }
            
            if (typeof value !== 'number') {
                value = parseFloat(value);
                if (isNaN(value)) {
                    return '0.00';
                }
            }
            
            return value.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        }
        
        // ==================== 填充采购详情表格（按日期分组） ====================
        function populateCycleData(plantType) {
            const data = decisionData[plantType];
            if (!data || !data.procurement_plan) {
                console.warn(plantNameMap[plantType] + '决策数据或采购计划不存在');
                return;
            }
            
            if (!Array.isArray(data.procurement_plan)) {
                console.warn(plantNameMap[plantType] + '采购计划不是数组格式');
                return;
            }
            
            // 添加煤种名称映射
            const coalNameMap = {
                'CCI4500': '北方港4500',
                'CCI5000': '北方港5000', 
                'CCI5500': '北方港5500',
                'CCI进口3800': '进口3800',
                'CCI进口4700': '进口4700',
                'CCI进口5500': '进口5500',
            };
            
            // 获取容器元素
            const container = document.getElementById('purchase-details-container');
            if (!container) return;
            
            // 清空容器
            container.innerHTML = '';
            
            // 按采购日期对采购项目进行分组
            const itemsByDate = {};
            
            // 遍历所有采购计划周期
            data.procurement_plan.forEach(cycle => {
                if (cycle && cycle.items && Array.isArray(cycle.items)) {
                    const purchaseDate = cycle.date || '未知日期';
                    
                    // 如果该日期还没有分组，创建一个新数组
                    if (!itemsByDate[purchaseDate]) {
                        itemsByDate[purchaseDate] = [];
                    }
                    
                    // 将该周期的所有采购项目添加到对应日期的分组中
                    cycle.items.forEach(item => {
                        if (item) {
                            itemsByDate[purchaseDate].push(item);
                        }
                    });
                }
            });
            
            // 如果没有采购项目
            const allDates = Object.keys(itemsByDate);
            if (allDates.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: orange; padding: 20px;">暂无采购项目数据</div>';
                return;
            }
            
            // 按日期排序
            allDates.sort((a, b) => {
                return new Date(a) - new Date(b);
            });
            
            // 为每个采购日期创建独立的表格
            allDates.forEach(date => {
                const items = itemsByDate[date];
                if (!items || items.length === 0) return;
                
                // 计算该日期的总采购量
                const totalQuantity = items.reduce((sum, item) => sum + (item.quantity || 0), 0);
                
                // 如果总采购量为0，跳过该日期
                if (totalQuantity === 0) {
                    return;
                }
                
                // 创建日期分组容器
                const dateContainer = document.createElement('div');
                dateContainer.style.marginBottom = '30px';
                dateContainer.style.padding = '20px';
                dateContainer.style.backgroundColor = '#ffffff';
                dateContainer.style.borderRadius = '10px';
                dateContainer.style.boxShadow = '0 4px 12px rgba(0, 0, 0, 0.1)';
                
                // 创建日期标题
                const dateTitle = document.createElement('h4');
                dateTitle.style.fontSize = '18px';
                dateTitle.style.fontWeight = 'bold';
                dateTitle.style.color = '#1a56db';
                dateTitle.style.marginBottom = '15px';
                dateTitle.style.paddingBottom = '8px';
                dateTitle.style.borderBottom = '2px solid #e0e7ff';
                dateTitle.innerHTML = `定标日: ${date} - 总采购量: ${formatNumber(totalQuantity)} 吨`;
                
                // 创建表格
                const table = document.createElement('table');
                table.className = 'data-table';
                
                // 创建表头
                const thead = document.createElement('thead');
                thead.innerHTML = `
                    <tr>
                        <th>煤种</th>
                        <th>采购数量(吨)</th>
                        <th>预测煤价(元/吨)</th>
                        <th>运费(元/吨)</th>
                        <th>到厂成本(元/吨)</th>
                        <th>最迟到厂日期</th>
                    </tr>
                `;
                
                // 创建表体
                const tbody = document.createElement('tbody');
                
                // 填充表格数据
                items.forEach(item => {
                    if (!item) return;
                    
                    const row = document.createElement('tr');
                    const quantity = item.quantity || 0;
                    const displayQuantity = formatNumber(quantity);
                    
                    // 使用映射后的煤种名称
                    const originalCoalName = item.coal_name || '未知煤种';
                    const displayCoalName = coalNameMap[originalCoalName] || originalCoalName;
                    
                    row.innerHTML = `
                        <td>${displayCoalName}</td>
                        <td>${displayQuantity}</td>
                        <td>${item.coal_price ? item.coal_price.toFixed(2) : '0.00'}</td>
                        <td>${item.freight ? item.freight.toFixed(2) : '0.00'}</td>
                        <td>${item.delivered_unit_cost ? item.delivered_unit_cost.toFixed(2) : '0.00'}</td>
                        <td>${item.latest_delivery_date && item.latest_delivery_date !== '0' ? item.latest_delivery_date : '待定'}</td>
                    `;
                    
                    if (quantity === 0) {
                        row.style.opacity = '0.6';
                        row.style.backgroundColor = '#f5f5f5';
                    }
                    
                    tbody.appendChild(row);
                });
                
                // 组装表格
                table.appendChild(thead);
                table.appendChild(tbody);
                
                // 组装日期分组容器
                dateContainer.appendChild(dateTitle);
                dateContainer.appendChild(table);
                
                // 将日期分组容器添加到主容器中
                container.appendChild(dateContainer);
            });
        }

        // ==================== 日期格式化函数 ====================
        Date.prototype.format = function(fmt) {
            var o = {
                "M+": this.getMonth() + 1,
                "m+": this.getMonth() + 1,
                "d+": this.getDate(),
                "Y+": this.getFullYear(),
            };
            
            for (var k in o) {
                if (new RegExp("(" + k + ")").test(fmt)) {
                    fmt = fmt.replace(RegExp.$1, (RegExp.$1.length == 1) ? (o[k]) : (("00" + o[k]).substr(("" + o[k]).length)));
                }
            }
            
            return fmt;
        };

                const apiUrl = 'http://10.73.56.38:8081/api/elec_prediction?type=' + type + '&days=' + days + '&infer_date=' + formattedDate + '&unit=' + unit;
                return fetch(apiUrl)
                    .then(function(response) {

                            throw new Error('API请求失败');
                        }
                        return response.json();
                    })
                    .catch(function(error) {
                        console.error('Error loading prediction data:', error);
                        return [];
                    });
            } else {
                const apiUrl = 'http://10.73.56.38:8081/api/prediction?type=' + type + '&days=' + days + '&date=' + formattedDate;
                return fetch(apiUrl)
                    .then(function(response) {

                        return response.json();

        // ==================== 下载数据报表 ====================
        function downloadData(pageId) {
            console.log('开始下载数据报表:', pageId);
            
            let selectedDate = new Date();
            const datePickerId = 'datePicker-' + pageId;
            const datePicker = document.getElementById(datePickerId);
            if (datePicker && datePicker.value) {
                selectedDate = new Date(datePicker.value);
            }
            
            const formattedDate = selectedDate.toISOString().split('T')[0];
            
            let type = null;
            const activeButton = document.querySelector('.coal-button[data-page="' + pageId + '"].active');
            if (activeButton) {
                type = activeButton.getAttribute('data-type');
            }
            
            if (!type && (pageId === 'domestic-freight' || pageId === 'international-freight')) {
                if (pageId === 'domestic-freight') {
                    type = 'insideinfer';
                } else if (pageId === 'international-freight') {
                    type = 'outsideinfer';
                }
            }
            
            if (!type) {
                alert('请先选择数据类型');
                return;
            }
            
            const realType = getRealDataType(type);
            let currentDays = 5;
            const activeRangeButton = document.querySelector('.range-button[data-page="' + pageId + '"].active');
            if (activeRangeButton) {
                currentDays = parseInt(activeRangeButton.getAttribute('data-days'));
            }
            
            let currentUnit = 'total';
            if (pageId === 'power-generation') {
                const activeUnitButton = document.querySelector('.coal-button[data-page="power-generation"][data-unit].active');
                currentUnit = activeUnitButton ? activeUnitButton.getAttribute('data-unit') : 'total';
            }
            
            console.log('下载参数:', {
                pageId,
                type,
                realType,
                currentDays,
                formattedDate,
                currentUnit
            });
            
            // 加载预测数据和真实数据
            Promise.all([
                loadPredictionData(type, currentDays, selectedDate, currentUnit),
                loadRealData(realType, currentDays, selectedDate, currentUnit)
            ]).then(function([predData, realData]) {
                console.log('获取到预测数据:', predData.length, '条');
                console.log('获取到真实数据:', realData.length, '条');
                
                // 处理数据，生成Excel
                const excelData = [];
                
                // 添加表头
                excelData.push(['时间', '真实值', '预测值', 'MAPE(%)']);
                
                // 遍历预测数据
                predData.forEach(function(predItem) {
                    const date = predItem.date;
                    let predictValue = predItem.predict;
                    
                    // 对于发电量分机组模式
                    if (pageId === 'power-generation' && currentUnit === 'units') {
                        const selectedUnit = document.getElementById('unit-dropdown') ? document.getElementById('unit-dropdown').value : null;
                        if (selectedUnit && predItem[selectedUnit] !== undefined) {
                            predictValue = predItem[selectedUnit];
                        }
                    }
                    
                    // 查找对应的真实数据
                    let realValue = '';
                    let mape = '';
                    const realItem = realData.find(item => item.date === date);
                    if (realItem) {
                        if (pageId === 'power-generation' && currentUnit === 'units') {
                            const selectedUnit = document.getElementById('unit-dropdown') ? document.getElementById('unit-dropdown').value : null;
                            if (selectedUnit && realItem[selectedUnit] !== undefined) {
                                realValue = realItem[selectedUnit];
                            }
                        } else {
                            realValue = realItem.value;
                        }
                        
                        // 计算 MAPE
                        if (realValue && realValue !== '' && predictValue && realValue !== 0) {
                            const realNum = parseFloat(realValue);
                            const predNum = parseFloat(predictValue);
                            if (!isNaN(realNum) && !isNaN(predNum) && realNum !== 0) {
                                mape = ((Math.abs(realNum - predNum) / Math.abs(realNum)) * 100).toFixed(2);
                            }
                        }
                    }
                    
                    // 取整真实值和预测值
                    const realValueInt = realValue !== '' ? Math.round(parseFloat(realValue)) : '';
                    const predictValueInt = predictValue !== '' ? Math.round(parseFloat(predictValue)) : '';
                    
                    // 添加到Excel数据
                    excelData.push([date, realValueInt, predictValueInt, mape]);
                });
                
                console.log('生成Excel数据:', excelData.length, '行');
                
                // 生成HTML格式的Excel文件（Excel可以打开）
                let htmlContent = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="UTF-8"></head><body>';
                htmlContent += '<table border="1" style="border-collapse: collapse;">';
                
                // 添加表头
                htmlContent += '<tr style="background-color: #4472C4; color: white; font-weight: bold;">';
                excelData[0].forEach(function(cell) {
                    htmlContent += '<td style="padding: 5px;">' + cell + '</td>';
                });
                htmlContent += '</tr>';
                
                // 添加数据行
                for (let i = 1; i < excelData.length; i++) {
                    htmlContent += '<tr>';
                    excelData[i].forEach(function(cell) {
                        htmlContent += '<td style="padding: 5px;">' + (cell !== '' ? cell : '') + '</td>';
                    });
                    htmlContent += '</tr>';
                }
                
                htmlContent += '</table></body></html>';
                
                // 生成文件名
                let fileName = '';
                if (pageId === 'domestic-coal') {
                    fileName = `国内煤价_${type.replace('infer', '')}_${formattedDate}_${currentDays}天.xls`;
                } else if (pageId === 'international-coal') {
                    fileName = `进口煤价_${type.replace('infer', '')}_${formattedDate}_${currentDays}天.xls`;
                } else if (pageId === 'domestic-freight') {
                    fileName = `国内运费_${formattedDate}_${currentDays}天.xls`;
                } else if (pageId === 'international-freight') {
                    fileName = `国际运费_${formattedDate}_${currentDays}天.xls`;
                } else if (pageId === 'power-generation') {
                    let plantName = '';
                    if (type === 'kemen') plantName = '可门电厂';
                    else if (type === 'shaowu') plantName = '邵武电厂';
                    else if (type === 'yongan') plantName = '永安电厂';

                    if (currentUnit === 'units') {
                        const selectedUnit = document.getElementById('unit-dropdown') ? document.getElementById('unit-dropdown').value : '';
                        fileName = `${plantName}_发电量_${selectedUnit}_${formattedDate}_${currentDays}天.xls`;
                    } else {
                        fileName = `${plantName}_发电量_${formattedDate}_${currentDays}天.xls`;
                    }
                }
                
                // 下载Excel文件
                const blob = new Blob([htmlContent], { type: 'application/vnd.ms-excel;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = fileName;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                console.log('数据报表下载完成:', fileName);
            }).catch(function(error) {
                console.error('下载数据失败:', error);
                alert('下载数据失败，请稍后重试');
            });
        }

        // 加载默认数据（如果JSON文件不存在）
        function loadDefaultDecisionData() {
            console.log('加载默认决策数据...');
            
            // 为每个电厂设置默认数据
            for (var plant in defaultDecisionData) {
                if (!decisionData[plant]) {
                    decisionData[plant] = defaultDecisionData[plant];
                    console.log('已加载' + plantNameMap[plant] + '默认数据');
                }
            }
            
            // 更新当前页面的UI
            if (currentPlant && decisionData[currentPlant]) {
                updateDecisionPageUI(currentPlant);
                
                const activePage = document.querySelector('.page-content[style*="display: block"]');
                if (activePage && activePage.id === 'decision-model-page') {
                    loadChart('decision-model', currentPlant, currentDays);
                }
            }
        }
        
        // 在fetch失败后尝试加载默认数据
        setTimeout(function() {
            // 如果某个电厂数据为空，尝试加载默认数据
            var needDefaultData = false;
            for (var plant in plantNameMap) {
                if (!decisionData[plant]) {
                    needDefaultData = true;
                    break;
                }
            }
            
            if (needDefaultData) {
                loadDefaultDecisionData();
            }
        }, 2000);
